name: CI-CD Pipeline

on:
    push:
        branches:
            - develop # adjust if you want master too
    pull_request:
        branches:
            - develop

jobs:
    lint-and-test:
        name: Lint & Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
            - run: npm ci
            - run: npm run lint:ci
            - run: npm test

    build-and-push:
        name: Build & Push Docker Image
        runs-on: ubuntu-latest
        needs: lint-and-test
        permissions:
            contents: read
            packages: write
        if: github.event_name == 'push'
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - name: Login vers GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extraction des métadonnées Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=sha,prefix=sha-
                      type=semver,pattern={{version}}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build et Push de l'image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

deploy-staging:
    name: Deploy to Staging (Service Container)
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
        contents: read
        packages: read

    services:
        app:
            image: ghcr.io/${{ github.repository }}:${{ github.sha }}
            ports:
                - 3005:3000
            env:
                NODE_ENV: staging
                PORT: 3000
            options: >-
                --health-cmd="wget -qO- http://localhost:3000/health || exit 1"
                --health-interval=30s
                --health-timeout=10s
                --health-retries=3
                --health-start-period=10s

    steps:
        - name: Checkout code
          uses: actions/checkout@v6

        - name: Wait for app health
          run: |
              for i in {1..5}; do
                curl -f http://localhost:3005/health && exit 0
                echo "Waiting for app to become healthy..."
                sleep 10
              done
              echo "App failed health check" && exit 1
