name: CI Pipeline

on:
    push:
        branches: [master, develop]
    pull_request:
        branches: [master, develop]

jobs:
    lint-and-test:
        name: Lint & Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "25"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint:ci

            - name: Run tests
              run: npm test
